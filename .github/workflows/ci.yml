name: Validation
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Domain tests
        run: npm test
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Excel and SQLite integration test
        run: node --test tests/integration.test.mjs
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflow tests
        run: npm run test:e2e

      - name: Pack source snapshot
        if: github.ref == 'refs/heads/release/v0.4.0'
        run: git archive HEAD | gzip -9 > worktrack-source.tgz
      - name: Upload source snapshot
        if: github.ref == 'refs/heads/release/v0.4.0'
        uses: actions/upload-artifact@v4
        with:
          name: worktrack-source
          path: worktrack-source.tgz
          retention-days: 1